# Copie para .github/workflows/homolog-vercel-deploy.yml (requer token GitHub com escopo workflow).
# Deploy automático do laboratório (branch hb-cooperativas-lab) — projeto Vercel SEPARADO do oficial.
# Pré-requisito: docs/VERCEL-LAB-CRIAR-PROJETO.md e secrets no GitHub (VERCEL_*_HOMOLOG).
name: Deploy laboratório (homolog)

on:
  push:
    branches: [hb-cooperativas-lab]
  workflow_dispatch:

concurrency:
  group: homolog-vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_HOMOLOG }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel env (homolog)
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build (homolog)
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production (lab URL)
        id: deploy
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Resumo
        run: |
          echo "Deploy laboratório concluído."
          echo "Confira a URL em https://vercel.com (projeto hbcooperativas-lab)."
          echo "Depois: HOMOLOG_APP_URL=<url> npm run confirm:homolog"
