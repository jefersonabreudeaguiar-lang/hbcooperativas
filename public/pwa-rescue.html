<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15803d" />
    <title>Reparar app HB Cooperativas</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        background: #f0fdf4;
        color: #14532d;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      main {
        max-width: 22rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.15rem;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 0.9rem;
        line-height: 1.45;
        margin: 0 0 0.75rem;
      }
      .btn {
        display: block;
        width: 100%;
        margin-top: 0.65rem;
        padding: 0.85rem 1rem;
        border: none;
        border-radius: 0.65rem;
        background: #15803d;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        box-sizing: border-box;
      }
      .btn.secondary {
        background: #fff;
        color: #15803d;
        border: 2px solid #15803d;
      }
      .muted {
        color: #4b5563;
        font-size: 0.8rem;
      }
      .err {
        color: #b91c1c;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Reparar atalho HB</h1>
      <p id="status">Aguarde… limpando cache e atalho antigo.</p>
      <p id="err" class="err" hidden></p>
      <p class="muted">
        Use <strong>Chrome</strong> com Wi‑fi ou dados. Se o erro aparecer antes desta tela verde:
        Chrome → cadeado → <strong>Limpar dados do site</strong> → abra este link de novo.
      </p>
      <button type="button" class="btn" id="go" hidden>Continuar para o login</button>
      <a class="btn secondary" id="launch" href="/login?hb-pwa=347" hidden>Continuar para instalar ícone</a>
      <a class="btn secondary" href="/pwa-diag.html" style="margin-top: 0.5rem">Diagnóstico (copiar para suporte)</a>
    </main>
    <script>
      (function () {
        var REPAIR_KEY = "hb-coop-pwa-repair-done";
        var REPAIR_VER = "347";
        var BUILD_FALLBACK = 347;
        var BUILD_SEEN_KEY = "hb-coop-app-build-seen";
        var target = "/login?hb-pwa=347";
        var params = new URLSearchParams(location.search);
        var next = params.get("next");
        var auto = params.get("auto") === "1";
        if (next && next.charAt(0) === "/") target = next;

        var status = document.getElementById("status");
        var errEl = document.getElementById("err");
        var btn = document.getElementById("go");
        var launch = document.getElementById("launch");

        function showErr(msg) {
          if (errEl) {
            errEl.textContent = msg;
            errEl.hidden = false;
          }
        }

        function done(msg) {
          if (status) status.textContent = msg;
          if (btn) btn.hidden = false;
          if (launch) launch.hidden = false;
        }

        function go() {
          try {
            location.href = target + (target.indexOf("?") >= 0 ? "&" : "?") + "_rescue=" + Date.now();
          } catch (e) {
            location.replace(target);
          }
        }

        if (btn) btn.addEventListener("click", go);

        var purgeCaches =
          "caches" in window
            ? caches.keys().then(function (keys) {
                return Promise.all(
                  keys.map(function (k) {
                    return caches.delete(k);
                  })
                );
              })
            : Promise.resolve();

        var purgeSw =
          "serviceWorker" in navigator
            ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs.map(function (r) {
                    return r.unregister();
                  })
                );
              })
            : Promise.resolve();

        function markRepaired(cloudBuild) {
          try {
            var ver = String(cloudBuild || BUILD_FALLBACK);
            sessionStorage.setItem(REPAIR_KEY, ver);
            localStorage.setItem(BUILD_SEEN_KEY, ver);
            localStorage.setItem("hb-coop-pwa-repair-done-build", ver);
          } catch (e) {
            /* ignore */
          }
        }

        Promise.all([purgeCaches, purgeSw])
          .catch(function (e) {
            showErr("Parte da limpeza falhou; toque Continuar mesmo assim.");
          })
          .then(function () {
            return fetch("/api/client-release?_=" + Date.now(), { cache: "no-store" })
              .then(function (r) {
                return r.ok ? r.json() : null;
              })
              .catch(function () {
                return null;
              });
          })
          .then(function (cloud) {
            markRepaired(cloud && cloud.build ? cloud.build : BUILD_FALLBACK);
            if (auto) {
              if (status) status.textContent = "Limpeza concluída. Abrindo o app…";
              window.setTimeout(go, 400);
              return;
            }
            done(
              "Limpeza concluída. Toque em Continuar (não feche antes). Depois use Preparar novo ícone e adicione à tela inicial."
            );
          });
      })();
    </script>
  </body>
</html>
