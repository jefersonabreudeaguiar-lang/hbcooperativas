<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15803d" />
    <title>HB Cooperativas</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #f9fafb;
        color: #15803d;
      }
    </style>
    <script>
      (function () {
        var target = "/dashboard" + (location.search || "") + (location.hash || "");
        function go() {
          location.replace(target);
        }
        if (!("serviceWorker" in navigator)) {
          go();
          return;
        }
        var purgeCaches =
          "caches" in window
            ? caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) {
                  return caches.delete(k);
                }));
              })
            : Promise.resolve();
        var purgeSw = navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(
            regs.map(function (r) {
              return r.unregister();
            })
          );
        });
        Promise.all([purgeCaches, purgeSw])
          .catch(function () {})
          .finally(go);
      })();
    </script>
  </head>
  <body>
    <p>Abrindo o app…</p>
  </body>
</html>
