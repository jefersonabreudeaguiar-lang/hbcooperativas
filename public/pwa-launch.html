<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15803d" />
    <title>HB Cooperativas</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #f0fdf4;
        color: #14532d;
        padding: 1.5rem;
        text-align: center;
      }
      p { margin: 0.5rem 0; font-size: 0.95rem; }
      .spin {
        width: 2rem;
        height: 2rem;
        border: 3px solid #bbf7d0;
        border-top-color: #15803d;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 1rem;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="spin" aria-hidden="true"></div>
      <p><strong>Abrindo HB Cooperativas…</strong></p>
      <p id="hint" style="font-size: 0.8rem; color: #4b5563">Aguarde um instante</p>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var next = params.get("next");
        var hasSession = false;
        try {
          hasSession = !!localStorage.getItem("coopeagriplla_session");
        } catch (e) {
          hasSession = false;
        }
        var target = "/login";
        if (next && next.charAt(0) === "/") {
          target = next;
        } else if (hasSession) {
          target = "/dashboard";
        }

        function go() {
          location.replace(target);
        }

        if (!("serviceWorker" in navigator)) {
          window.setTimeout(go, 200);
          return;
        }

        navigator.serviceWorker
          .register("/sw.js", { scope: "/", updateViaCache: "none" })
          .catch(function () {})
          .finally(function () {
            window.setTimeout(go, 450);
          });
      })();
    </script>
  </body>
</html>
