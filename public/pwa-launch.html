<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15803d" />
    <title>HB Cooperativas</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #f0fdf4;
        color: #14532d;
        padding: 1.5rem;
        text-align: center;
      }
      p { margin: 0.5rem 0; font-size: 0.95rem; }
      .spin {
        width: 2rem;
        height: 2rem;
        border: 3px solid #bbf7d0;
        border-top-color: #15803d;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 1rem;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="spin" aria-hidden="true"></div>
      <p><strong>Entrando no HB Cooperativas…</strong></p>
      <p id="hint" style="font-size: 0.8rem; color: #4b5563">Aguarde um instante</p>
    </div>
    <script>
      (function () {
        var REPAIR_KEY = "hb-coop-pwa-repair-done";
        var DIRECT_ENTRY_KEY = "hb-coop-pwa-direct-entry";
        var BUILD_SEEN_KEY = "hb-coop-app-build-seen";
        var FALLBACK_BUILD = 354;
        var params = new URLSearchParams(location.search);
        var next = params.get("next");
        var hasSession = false;
        try {
          hasSession = !!localStorage.getItem("coopeagriplla_session");
        } catch (e) {
          hasSession = false;
        }

        function defaultLoginTarget(pageBuild) {
          return "/login?hb-pwa=" + pageBuild + "&next=%2Fdashboard";
        }

        function resolveTarget(pageBuild) {
          var target = defaultLoginTarget(pageBuild);
          if (next && next.charAt(0) === "/") {
            target =
              next.indexOf("hb-pwa=") >= 0
                ? next
                : next + (next.indexOf("?") >= 0 ? "&" : "?") + "hb-pwa=" + pageBuild;
          } else if (hasSession) {
            target = "/dashboard?hb-pwa=" + pageBuild;
          }
          return target;
        }

        function go(pageBuild, target) {
          try {
            sessionStorage.setItem(DIRECT_ENTRY_KEY, "1");
            sessionStorage.setItem(REPAIR_KEY, String(pageBuild));
            localStorage.setItem(BUILD_SEEN_KEY, String(pageBuild));
            localStorage.setItem("hb-coop-pwa-repair-done-build", String(pageBuild));
          } catch (e) {
            /* ignore */
          }
          location.replace(target);
        }

        function goWithRetry(pageBuild, target, attempt) {
          go(pageBuild, target);
          if (attempt >= 2) return;
          window.setTimeout(function () {
            if (location.pathname.indexOf("pwa-launch") >= 0) {
              goWithRetry(pageBuild, target, attempt + 1);
            }
          }, 2800);
        }

        function purgeCaches() {
          if (!("caches" in window)) return Promise.resolve();
          return caches.keys().then(function (keys) {
            return Promise.all(
              keys.map(function (k) {
                return caches.delete(k);
              })
            );
          });
        }

        function purgeServiceWorkers() {
          if (!("serviceWorker" in navigator)) return Promise.resolve();
          return navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(
              regs.map(function (r) {
                return r.unregister();
              })
            );
          });
        }

        function registerPassthrough() {
          if (!("serviceWorker" in navigator)) return Promise.resolve();
          return navigator.serviceWorker.register("/sw.js", {
            scope: "/",
            updateViaCache: "none",
          });
        }

        function waitReady(ms) {
          if (!("serviceWorker" in navigator)) return Promise.resolve();
          return Promise.race([
            navigator.serviceWorker.ready,
            new Promise(function (resolve) {
              window.setTimeout(resolve, ms);
            }),
          ]);
        }

        function runLaunch(pageBuild) {
          var target = resolveTarget(pageBuild);
          if (hasSession) {
            window.setTimeout(function () {
              goWithRetry(pageBuild, target, 0);
            }, 120);
            return;
          }
          purgeCaches()
            .catch(function () {})
            .then(purgeServiceWorkers)
            .catch(function () {})
            .then(registerPassthrough)
            .catch(function () {})
            .then(function () {
              return waitReady(2500);
            })
            .finally(function () {
              window.setTimeout(function () {
                goWithRetry(pageBuild, target, 0);
              }, 200);
            });
        }

        fetch("/api/client-release?_=" + Date.now(), { cache: "no-store", credentials: "same-origin" })
          .then(function (r) {
            return r.ok ? r.json() : null;
          })
          .then(function (cloud) {
            var pageBuild =
              cloud && cloud.build ? Number(cloud.build) : FALLBACK_BUILD;
            if (!pageBuild || pageBuild < 1) pageBuild = FALLBACK_BUILD;
            runLaunch(pageBuild);
          })
          .catch(function () {
            runLaunch(FALLBACK_BUILD);
          });
      })();
    </script>
  </body>
</html>
